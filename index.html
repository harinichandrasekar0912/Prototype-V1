<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design Assistant — Prototype V1</title>
  <meta name="description" content="Human-in-the-loop computational design assistant: site → analysis → zoning → programme → bubbles → single-line plans → recorded design evolution." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark">◩</span><div><b>Design Assistant</b><span>Prototype V1 · digital junior architect</span></div></div>
    <div class="proj"><input id="proj-name" type="text" aria-label="Project name" /><span id="proj-meta"></span></div>
    <div class="top-actions">
      <button class="btn ghost" data-action="goto" data-stage="record">Record & export</button>
      <button class="btn" data-action="sheets">Output sheets</button>
    </div>
  </header>

  <nav id="rail" class="rail" aria-label="Design stages"></nav>

  <main id="main" class="main" data-mode="canvas">
    <div id="toolbar" class="toolbar"></div>
    <div class="canvas-wrap">
      <svg id="svg" class="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="compare" class="compare hidden"></div>
      <div class="ov ov-tl"><div id="legend" class="legend-ov"></div></div>
      <div class="ov ov-tr"><div class="north"><svg id="north" viewBox="-12 -12 24 24"><path d="M0,-10 L5,8 L0,4 L-5,8 Z" fill="#1b1b19"/><text x="0" y="-12.5" text-anchor="middle" font-size="6" font-weight="600" fill="#1b1b19">N</text></svg></div></div>
      <div class="ov ov-bl"><div id="scalebar" class="scalebar"></div><div id="coords" class="coords"></div></div>
    </div>
    <div id="table" class="table-view"></div>
    <div id="record" class="record-view"></div>
  </main>

  <aside id="panel" class="panel" aria-label="Stage panel"></aside>

  <footer id="timeline" class="timeline"></footer>

  <div id="sheets" class="sheets hidden"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="busy" class="busy"><div><span class="spin"></span><span id="busy-label"></span></div></div>

  <noscript>This prototype needs JavaScript (ES modules). Serve the folder over HTTP — see README.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
